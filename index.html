<script>
(async function(){
  const status=document.getElementById('status');
  try{
    if(!('DecompressionStream' in window)) throw new Error('Seu navegador está desatualizado. Atualize o Chrome, Edge ou Safari e tente novamente.');
    const encoded=document.getElementById('compressed-app').textContent.trim();
    const binary=atob(encoded);
    const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(error){
    status.textContent='Não foi possível abrir a ficha. '+(error&&error.message?error.message:'Tente atualizar o navegador.');
    console.error(error);
  }
})();
</script>
